<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Novo Hikitsugui</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gray-100">

    <!-- =========================================================
         BARRA AZUL (padrão TeamOps)
    ========================================================= -->
    <div class="header-bar">
        <span id="txtHeaderTitle">Registrar Hikitsugui</span>
    </div>

    <!-- =========================================================
         FORMULÁRIO PRINCIPAL
    ========================================================= -->
    <div class="form-container">

        <!-- GRID 2 COLUNAS -->
        <div class="grid-2col">

            <div>
                <label id="txtDateLabel" class="text-gray-600">Data</label>
                <input id="txtDate" type="date" class="input"/>
            </div>

            <div>
                <label id="txtCreatorLabel" class="text-gray-600">Criador</label>
                <input id="txtCreator" type="text" class="input" readonly />
            </div>

            <div>
                <label id="txtShiftLabel" class="text-gray-600">Turno</label>
                <select id="shiftId" class="input"></select>
            </div>

            <div>
                <label id="txtCategoryLabel" class="text-gray-600">Categoria</label>
                <select id="categoryId" class="input"></select>
            </div>

            <div>
                <label id="txtEquipmentLabel" class="text-gray-600">Equipamento</label>
                <select id="equipId" class="input">
                    <option id="txtEquipPlaceholder" value="0">Selecionar...</option>
                </select>
            </div>

            <div>
                <label id="txtLocalLabel" class="text-gray-600">Local</label>
                <select id="localId" class="input">
                    <option id="txtLocalPlaceholder" value="0">Selecionar...</option>
                </select>
            </div>

            <div>
                <label id="txtSectorLabel" class="text-gray-600">Setor</label>
                <select id="sectorId" class="input">
                    <option id="txtSectorPlaceholder" value="0">Selecionar...</option>
                </select>
            </div>

        </div>

        <div class="grid-2col mt-4">
            <div>
                <label id="txtAudienceTypeLabel" class="text-gray-600">Audiência</label>
                <select id="audienceType" class="input">
                    <option id="txtAudienceSectorOption" value="sector">Setor(es)</option>
                    <option id="txtAudienceOrganizationOption" value="organization">Unidade organizacional</option>
                    <option id="txtAudienceGeneralOption" value="general">Toda a organização</option>
                </select>
            </div>

            <div id="audienceSectorsField">
                <label id="txtAudienceSectorsLabel" class="text-gray-600">Setores destinatários</label>
                <select id="audienceSectorIds" class="input" multiple></select>
            </div>

            <div id="audienceOrganizationField" hidden>
                <label id="txtAudienceOrganizationLabel" class="text-gray-600">Unidade destinatária</label>
                <select id="audienceOrganizationNodeId" class="input"></select>
            </div>
        </div>

        <div class="mt-4">
            <div class="audience-profile-heading">
                <label id="txtAudienceProfilesLabel" class="text-gray-600">Perfis autorizados a visualizar</label>
                <span id="txtAudienceProfilesHint">Selecione explicitamente quem poderá ler este registro.</span>
            </div>
            <div id="audienceProfiles" class="audience-profile-grid" role="group"></div>
        </div>

        <!-- =========================================================
        DESCRIÇÃO
        ========================================================= -->
        <div class="mt-4">
            <label id="txtDescriptionLabel" class="text-gray-600">Descrição</label>
        
            <!-- Toolbar -->
            <div class="editor-toolbar">
                <button type="button" data-cmd="bold"><b>B</b></button>
                <button type="button" data-cmd="italic"><i>I</i></button>
                <button type="button" data-cmd="underline"><u>U</u></button>
                <span class="separator"></span>
                <button type="button" id="btnBulletList" data-cmd="insertUnorderedList">• Lista</button>
                <button type="button" id="btnClearFormat">Limpar</button>
            </div>
        
            <!-- Editor HTML -->
            <div id="txtDescricao" class="editor" contenteditable="true"></div>
        </div>

        <!-- =========================================================
             ANEXOS
        ========================================================= -->
        <div class="mt-4">
            <label id="txtAttachmentsLabel" class="text-gray-600">Anexos</label>
            <input id="fileUpload" type="file" multiple class="input" />
            <ul id="fileList" class="file-list"></ul>
        </div>

        <!-- =========================================================
             BOTÕES
        ========================================================= -->
        <div class="flex justify-end gap-4 mt-4 pt-2">
            <button id="btnSalvar" class="btn-primary">Salvar</button>
            <button id="btnCancelar" class="btn-secondary">Cancelar</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
